<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEN – Crear Empleado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111318;
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR igual al dashboard */
    .sidebar {
      width: 220px;
      background: #1a1d24;
      border-right: 1px solid #2a2d36;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      padding: 1.5rem 1rem;
    }
    .sidebar-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 4px; color: #fff; text-align: center; margin-bottom: 0.3rem; }
    .sidebar-sub  { font-size: 0.65rem; color: #475569; text-align: center; margin-bottom: 2rem; }
    .sidebar-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: #475569; margin: 1rem 0 0.4rem 0.5rem; }
    .nav-link { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.75rem; border-radius: 7px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; transition: background 0.2s, color 0.2s; margin-bottom: 0.15rem; }
    .nav-link:hover, .nav-link.activo { background: #2a2d36; color: #e2e8f0; }
    .nav-link i { font-size: 1rem; }
    .sidebar-footer { margin-top: auto; border-top: 1px solid #2a2d36; padding-top: 1rem; }
    .nav-link.cerrar { color: #ef4444; }
    .nav-link.cerrar:hover { background: rgba(239,68,68,0.1); color: #ef4444; }

    /* CONTENIDO */
    .contenido {
      margin-left: 220px;
      flex: 1;
      padding: 2rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .topbar h1 { font-size: 1.2rem; font-weight: 700; color: #fff; }

    .volver {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.82rem;
      transition: color 0.2s;
    }
    .volver:hover { color: #e2e8f0; }

    /* FORMULARIO */
    .form-card {
      background: #1a1d24;
      border: 1px solid #2a2d36;
      border-radius: 12px;
      padding: 2rem;
      max-width: 640px;
    }

    .form-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #2a2d36;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-card h2 i { color: #3b82f6; }

    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .campo { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      background: #111318;
      border: 1px solid #2a2d36;
      border-radius: 7px;
      color: #e2e8f0;
      font-size: 0.88rem;
      padding: 0.6rem 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { border-color: #3b82f6; }
    input::placeholder { color: #3a3f4a; }

    select option { background: #1a1d24; }

    /* Error */
    .alerta {
      border-radius: 7px;
      padding: 0.6rem 0.85rem;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .alerta.error   { background: rgba(239,68,68,0.08);  border: 1px solid rgba(239,68,68,0.25);  color: #f87171; }
    .alerta.exito   { background: rgba(34,197,94,0.08);  border: 1px solid rgba(34,197,94,0.25);  color: #4ade80; }

    /* Botones */
    .botones {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #2a2d36;
    }

    .btn {
      padding: 0.6rem 1.3rem;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #2a2d36; color: #94a3b8; }
    .btn-secondary:hover { background: #363a45; color: #e2e8f0; }
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-logo">SEN</div>
  <div class="sidebar-sub">Sistema de Nómina</div>
  <div class="sidebar-label">Principal</div>
  <a href="/dashboard" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <div class="sidebar-label">Gestión</div>
  <a href="/empleados" class="nav-link activo"><i class="bi bi-people-fill"></i> Empleados</a>
  <a href="/grupos" class="nav-link"><i class="bi bi-diagram-3-fill"></i> Grupos</a>
  <div class="sidebar-footer">
    <a href="/logout" class="nav-link cerrar"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
  </div>
</nav>

<main class="contenido">

  <div class="topbar">
    <h1>Crear Empleado</h1>
    <a href="/empleados" class="volver"><i class="bi bi-arrow-left"></i> Volver</a>
  </div>

  {% if error %}
  <div class="alerta error"><i class="bi bi-exclamation-circle-fill"></i> {{ error }}</div>
  {% endif %}
  {% if exito %}
  <div class="alerta exito"><i class="bi bi-check-circle-fill"></i> {{ exito }}</div>
  {% endif %}

  <div class="form-card">
    <h2><i class="bi bi-person-plus-fill"></i> Datos del Empleado</h2>

    <form method="POST" action="/empleados/crear">

      <div class="fila">
        <div class="campo">
          <label>Nombre completo *</label>
          <input type="text" name="nombre" placeholder="Ej: Juan Carlos Pérez" required />
        </div>
        <div class="campo">
          <label>Número de documento *</label>
          <input type="text" name="documento" placeholder="Ej: 10234567" required />
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Cargo *</label>
          <input type="text" name="cargo" placeholder="Ej: Operario" required />
        </div>
        <div class="campo">
          <label>Fecha de contratación *</label>
          <input type="date" name="fecha_contrato" required />
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label>Salario base (COP) *</label>
          <input type="number" name="salario_base" placeholder="Ej: 1423500" min="0" required />
        </div>
        <div class="campo">
          <label>Grupo</label>
          <select name="id_grupo">
            <option value="">— Sin grupo —</option>
            {% for g in grupos %}
            <option value="{{ g.id }}">{{ g.nombre }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="botones">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg"></i> Guardar Empleado
        </button>
        <a href="/empleados" class="btn btn-secondary">Cancelar</a>
      </div>

    </form>
  </div>

</main>
</body>
</html>
